<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Lesson_36</title>
</head>
<body>
    <div class="page">
        <div class="page__bg">
            <img src="./img/cuphead.gif" alt="" class="page__gif">
            <div class="page__overlay"></div>
            <div class="page__grain"></div>
        </div>

        <header class="header">
            <input type="checkbox" class="menu-open" id="menu-open">

            <div class="header__bar">
                <a href="#" class="logo">
                    <img src="./img/cuphead_logo.png" alt="Cuphead" class="logo__img">
                </a>

                <nav class="nav nav--desktop">
                    <ul class="nav__menu">
                        <li class="nav__item"><a class="nav__link" href="#">Home</a></li>
                        <li class="nav__item"><a class="nav__link" href="#">About</a></li>
                        <li class="nav__item"><a class="nav__link" href="#">Services</a></li>
                        <li class="nav__item"><a class="nav__link" href="#">Contact</a></li>
                    </ul>
                </nav>

                <div class="join join--desktop">
                    <button class="sign-in__button" type="button">SIGN IN</button>
                    <button class="sign-up__button" type="button">SIGN UP</button>
                </div>

                <label class="burger" for="menu-open" aria-label="Open menu">
                    <span class="burger__line"></span>
                    <span class="burger__line"></span>
                    <span class="burger__line"></span>
                </label>
            </div>

            <div class="menu-drawer">
                <nav class="nav nav--mobile">
                    <ul class="nav__menu">
                        <li class="nav__item"><a class="nav__link" href="#">Home</a></li>
                        <li class="nav__item"><a class="nav__link" href="#">About</a></li>
                        <li class="nav__item"><a class="nav__link" href="#">Services</a></li>
                        <li class="nav__item"><a class="nav__link" href="#">Contact</a></li>
                    </ul>
                </nav>

                <div class="join join--mobile">
                    <button class="sign-in__button" type="button">SIGN IN</button>
                    <button class="sign-up__button" type="button">SIGN UP</button>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
